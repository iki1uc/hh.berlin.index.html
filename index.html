.text-\[var\(--ink\)\] {
  color: var(--ink);
}
.text-\[var\(--ink-dim\)\] {
  color: var(--ink-dim);
}
.text-\[var\(--ink-faint\)\] {
  color: var(--ink-faint);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --panel: #111111;
  --panel-2: #161616;
  --ink: #00ff00;
  --ink-dim: #00b300;
  --ink-faint: #007700;
  --accent: #66ccff;
  --accent-dim: #2a6f8f;
  --warn: #ffcc00;
  --bad: #ff4444;
  --line: #1e1e1e;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --panel: #111111;
    --panel-2: #161616;
    --ink: #00ff00;
    --ink-dim: #00b300;
    --ink-faint: #007700;
    --accent: #66ccff;
    --accent-dim: #2a6f8f;
    --warn: #ffcc00;
    --bad: #ff4444;
    --line: #1e1e1e;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) var(--bg);
}
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
*::-webkit-scrollbar-thumb {
  background: var(--ink-faint);
}
*::-webkit-scrollbar-track {
  background: var(--bg);
}
input[type="range"] {
  -webkit-appearance: none;
  -moz-appearance: none;
       appearance: none;
  height: 4px;
  background: var(--line);
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  background: var(--bg);
  border: 2px solid var(--accent);
  border-radius: 0;
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: var(--bg);
  border: 2px solid var(--accent);
  border-radius: 0;
  cursor: pointer;
}
@keyframes blink {
  0%, 60% {
    opacity: 1;
  }
  61%, 100% {
    opacity: 0;
  }
}
.blink {
  animation: blink 1.1s steps(1) infinite;
}
@keyframes scanpulse {
  0% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
  100% {
    opacity: 0.35;
  }
}
.scanpulse {
  animation: scanpulse 2.2s ease-in-out infinite;
}
.cell-btn {
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.cell-btn:hover {
  background: var(--panel-2);
  color: var(--accent);
}
.last\:border-b-0:last-child {
  border-bottom-width: 0px;
}
.hover\:border-\[var\(--accent-dim\)\]:hover {
  border-color: var(--accent-dim);
}
.hover\:border-\[var\(--ink-faint\)\]:hover {
  border-color: var(--ink-faint);
}
.hover\:text-\[var\(--accent\)\]:hover {
  color: var(--accent);
}
@media (min-width: 640px) {
  .sm\:text-\[10px\] {
    font-size: 10px;
  }
  .sm\:text-\[11px\] {
    font-size: 11px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
}
@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[340px_1fr\] {
    grid-template-columns: 340px 1fr;
  }
}
